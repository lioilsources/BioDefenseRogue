name: Release Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Release Android
    runs-on: ubuntu-latest
    env:
      # Secrets can't be read in a step's `if`; a job env can.
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: immunorun
        run: flutter pub get

      - name: Bump build number
        working-directory: immunorun
        run: |
          # Tag v1.2.3 nebo v1.2.3-alpha → 1.2.3; ruční spuštění bere verzi z pubspec.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BASE="${GITHUB_REF_NAME#v}"
            BASE="${BASE%%-*}"
          else
            BASE=$(grep '^version:' pubspec.yaml | sed -E 's/^version: ([0-9.]+).*/\1/')
          fi
          if [[ ! "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Neplatná verze '$BASE' (tag musí být vX.Y.Z[-přípona])"
            exit 1
          fi
          NEW="${BASE}+${{ github.run_number }}"
          sed -i -E "s/^version: .*/version: ${NEW}/" pubspec.yaml
          echo "Build version: ${NEW}"

      - name: Create keystore and key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo -n "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > immunorun/android/app/release.keystore
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > immunorun/android/key.properties

      - name: Build release AAB
        working-directory: immunorun
        run: flutter build appbundle --release

      - name: Build release APK
        working-directory: immunorun
        run: flutter build apk --release

      - name: Verify APK signing certificate
        run: |
          APK="immunorun/build/app/outputs/flutter-apk/app-release.apk"
          echo "=== APK signing certificate ==="
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | head -20

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            immunorun/build/app/outputs/bundle/release/app-release.aab
            immunorun/build/app/outputs/flutter-apk/app-release.apk
          name: BioDefenseRogue ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          # Přípona tagu (v1.2.3-alpha, -rc1…) = pre-release; stejně jako release-ios.
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Upload to Firebase App Distribution
        if: env.FIREBASE_APP_ID != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: Alfa
          releaseNotes: "BioDefenseRogue ${{ github.ref_name }} (build ${{ github.run_number }})"
          file: immunorun/build/app/outputs/flutter-apk/app-release.apk
