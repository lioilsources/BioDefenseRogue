name: ci

# Brána na každém PR a push do main (Prompts/06-sync ADR 0003).
# Cíl doby běhu < 6 min — jinak se brána začne obcházet.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: immunorun

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # Gen-check: generované soubory musí odpovídat zdroji (regenerace bez diffu).
      # Naplní S2 (tool/gen_balance_map.dart → lib/config/balance_map.g.dart).
      - name: Gen-check
        run: |
          echo "Zatím žádné generované soubory (přibudou v S2)."
          git diff --exit-code

      # Velikost assetů: zatím jen výpis; limit (assets/book ≤ 12 MB) přidá K4.
      - name: Asset size
        run: du -sh assets/* | sort -h
